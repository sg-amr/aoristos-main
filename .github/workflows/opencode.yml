name: AI PR Generator

on:
  issue_comment:
    types: [created]

jobs:
  ai_coding:
    if: startsWith(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OpenCode AI Action
        uses: all-in-a-is-all-you-need/aicursor@v1
        with:
          model: "gemini-2.5-flash" 
          api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          instruction: ${{ github.event.comment.body }}
